name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: Ruff check
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with all extras
        run: pip install -e ".[full]"
      - name: Run tests
        run: pytest -v --tb=short

  build:
    name: Build wheel
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - name: Build sdist + wheel
        run: python -m build
      - name: Verify wheel installs
        run: |
          pip install dist/*.whl[full]
          python -c "from wfm_toolkit import __version__; print('v' + __version__)"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  smoke:
    name: Smoke test (bare install)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bare install (no extras)
        run: pip install dist/*.whl
      - name: Verify imports work
        run: |
          python -c "import wfm_toolkit; print('OK version', wfm_toolkit.__version__)"
          python -c "from wfm_toolkit.cli import main; print('CLI OK')"
      - name: CLI commands
        run: |
          wfm-toolkit --help
          wfm-toolkit doctor
          wfm-toolkit capabilities
