# pyproject.toml for workforce-management-toolkit

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "workforce-management-toolkit"
version = "0.1.0"
description = "Thin vendor-neutral Python library for Workforce Management tooling — forecasting, staffing, and validation through consistent interfaces."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [
    {name = "Workforce Management Toolkit Contributors"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office Management :: Scheduling"
]
keywords = [
    "workforce-management",
    "wfm",
    "staffing",
    "forecasting",
    "validation",
    "contact-center",
    "open-source"
]
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "pydantic>=2.0.0",
    "PyYAML>=6.0",
    "click>=8.0",
]

[project.urls]
Homepage = "https://github.com/jenquespark/workforce-management-toolkit"
Documentation = "https://github.com/jenquespark/workforce-management-toolkit#readme"
"Bug Reports" = "https://github.com/jenquespark/workforce-management-toolkit/issues"
"Source Code" = "https://github.com/jenquespark/workforce-management-toolkit"

[project.optional-dependencies]
forecast = [
    "statsforecast>=2.0.0"
]
staffing = [
    "pyworkforce>=0.5.2"
]
validation = [
    "pandera>=0.33.0"
]
full = [
    "statsforecast>=2.0.0",
    "pyworkforce>=0.5.2",
    "pandera>=0.33.0"
]

[project.scripts]
wfm-toolkit = "wfm_toolkit.cli:main"

[tool.setuptools.packages.find]
include = ["wfm_toolkit*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]